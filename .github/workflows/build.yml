name: Build Camera Flick

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        shell: bash
        run: |
          find . -name build.gradle -print
          PROJECT_DIR="$(dirname "$(find . -name build.gradle -print -quit)")"
          if [ "$PROJECT_DIR" = "." ] || [ -z "$PROJECT_DIR" ]; then
            echo "Could not find build.gradle"
            exit 1
          fi
          gradle -p "$PROJECT_DIR" build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CameraFlick-JAR
          path: build/libs/*.jar
