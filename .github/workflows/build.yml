name: Build Camera Flick

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and build mod
        shell: bash
        run: |
          GRADLE_FILE="$(find . -type f -name build.gradle -print -quit)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: build.gradle was not found."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "Building project in: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CameraFlick-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
